<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Apple Obsidian Dark Emerald Velvet Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1712" />
      <stop offset="50%" stop-color="#090d0a" />
      <stop offset="100%" stop-color="#121b14" />
    </linearGradient>
    <!-- Apple Fitness Neon Green Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="40%" stop-color="#30d158" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="softGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Squircle rounded background -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="106" fill="none" stroke="rgba(48, 209, 88, 0.25)" stroke-width="2.5" />
  
  <!-- Apple minimal dumbbell + nutrition icon -->
  <g transform="translate(106, 126)">
    <!-- Dumbbell Left Plate -->
    <rect x="0" y="70" width="34" height="120" rx="17" fill="url(#greenGrad)" />
    <rect x="22" y="88" width="18" height="84" rx="9" fill="#059669" opacity="0.6" />
    
    <!-- Dumbbell Center Bar -->
    <rect x="34" y="116" width="232" height="28" rx="14" fill="#f0fdf4" />
    <!-- Textured Gripping Center -->
    <rect x="110" y="112" width="80" height="36" rx="8" fill="#1f2923" />
    <line x1="126" y1="112" x2="126" y2="148" stroke="#0a0f0c" stroke-width="2.5" />
    <line x1="140" y1="112" x2="140" y2="148" stroke="#0a0f0c" stroke-width="2.5" />
    <line x1="154" y1="112" x2="154" y2="148" stroke="#0a0f0c" stroke-width="2.5" />
    <line x1="168" y1="112" x2="168" y2="148" stroke="#0a0f0c" stroke-width="2.5" />

    <!-- Dumbbell Right Plate -->
    <rect x="260" y="88" width="18" height="84" rx="9" fill="#059669" opacity="0.6" />
    <rect x="266" y="70" width="34" height="120" rx="17" fill="url(#greenGrad)" />
    
    <!-- Minimalist Botanical Leaf (Nutrition Sprout) -->
    <path d="M150 72 C 130 12, 195 2, 202 12 C 210 24, 210 62, 150 72 Z" fill="url(#softGreen)" />
    <path d="M150 72 C 172 38, 190 26, 202 12" stroke="#047857" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>
  
  <!-- Apple-style typography -->
  <text x="256" y="420" text-anchor="middle" fill="#f0fdf4" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-weight="800" font-size="44" letter-spacing="3">FITPANTRY</text>
  <text x="256" y="452" text-anchor="middle" fill="#30d158" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-weight="600" font-size="18" letter-spacing="7">PRO • EDITION</text>
</svg>
