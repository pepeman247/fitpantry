<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Apple Obsidian Velvet Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141118" />
      <stop offset="50%" stop-color="#0c0a0e" />
      <stop offset="100%" stop-color="#18131d" />
    </linearGradient>
    <!-- Apple Rose Gold / Blush Pink Gradient -->
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="softBlush" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
  </defs>

  <!-- Squircle rounded background -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="106" fill="none" stroke="rgba(251, 113, 133, 0.18)" stroke-width="2.5" />
  
  <!-- Apple minimal dumbbell + nutrition icon -->
  <g transform="translate(106, 126)">
    <!-- Dumbbell Left Plate -->
    <rect x="0" y="70" width="34" height="120" rx="17" fill="url(#roseGrad)" />
    <rect x="22" y="88" width="18" height="84" rx="9" fill="#e11d48" opacity="0.6" />
    
    <!-- Dumbbell Center Bar -->
    <rect x="34" y="116" width="232" height="28" rx="14" fill="#fdf2f8" />
    <!-- Textured Gripping Center -->
    <rect x="110" y="112" width="80" height="36" rx="8" fill="#3f3a46" />
    <line x1="126" y1="112" x2="126" y2="148" stroke="#1f1c24" stroke-width="2.5" />
    <line x1="140" y1="112" x2="140" y2="148" stroke="#1f1c24" stroke-width="2.5" />
    <line x1="154" y1="112" x2="154" y2="148" stroke="#1f1c24" stroke-width="2.5" />
    <line x1="168" y1="112" x2="168" y2="148" stroke="#1f1c24" stroke-width="2.5" />

    <!-- Dumbbell Right Plate -->
    <rect x="260" y="88" width="18" height="84" rx="9" fill="#e11d48" opacity="0.6" />
    <rect x="266" y="70" width="34" height="120" rx="17" fill="url(#roseGrad)" />
    
    <!-- Minimalist Botanical Leaf (Nutrition Sprout) -->
    <path d="M150 72 C 130 12, 195 2, 202 12 C 210 24, 210 62, 150 72 Z" fill="url(#softBlush)" />
    <path d="M150 72 C 172 38, 190 26, 202 12" stroke="#be185d" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>
  
  <!-- Apple-style typography -->
  <text x="256" y="420" text-anchor="middle" fill="#fdf2f8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-weight="800" font-size="44" letter-spacing="3">FITPANTRY</text>
  <text x="256" y="452" text-anchor="middle" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-weight="600" font-size="18" letter-spacing="7">PRO • EDITION</text>
</svg>
